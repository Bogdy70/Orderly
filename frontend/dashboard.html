<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orderly | Your Spaces</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">Orderly</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="small text-muted">Hello, <strong id="nav-username">Guest</strong></span>
        <button id="logout-btn" class="btn btn-outline-danger btn-sm">Log out</button>
      </div>
    </div>
  </nav>

  <main class="py-5 bg-light min-vh-100">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
          <h1 class="h2 fw-bold mb-1">Your spaces</h1>
          <p class="text-muted mb-0">Keep ideas, lists and priorities organized in one clear workspace.</p>
        </div>
        <div class="search-box">
          <input id="project-search" class="form-control" type="text" placeholder="Search by name or category..." />
        </div>
      </div>

      <div id="dashboard-alert" class="alert alert-warning d-none"></div>

      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <h2 class="h4 mb-1">Create a new space</h2>
          <p class="text-muted mb-3">Start with a blank space, then add a checklist or action list when you are ready.</p>

          <form id="project-form" class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="project-title">Space name</label>
              <input id="project-title" class="form-control" type="text" required />
            </div>

            <div class="col-md-4">
              <label class="form-label" for="project-category">Category</label>
              <input id="project-category" class="form-control" type="text" placeholder="Planning, Personal, Team..." required />
            </div>

            <div class="col-md-4">
              <label class="form-label" for="project-owner">Lead</label>
              <input id="project-owner" class="form-control" type="text" required />
            </div>

            <div class="col-12">
              <label class="form-label" for="project-description">Summary</label>
              <textarea id="project-description" class="form-control" rows="3" required></textarea>
            </div>

            <div class="col-12">
              <button class="btn btn-primary" type="submit">Create space</button>
            </div>
          </form>
        </div>
      </div>

      <div id="project-list" class="row g-4"></div>
    </div>
  </main>

  <script src="script.js?v=20260413-no-legacy"></script>
</body>
</html>
