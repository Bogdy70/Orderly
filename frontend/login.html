<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orderly | Sign In</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">Orderly</a>
      <a class="btn btn-outline-secondary btn-sm ms-auto" href="index.html">Back</a>
    </div>
  </nav>

  <main class="min-vh-100 d-flex align-items-center bg-light">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <h1 class="h3 fw-bold">Open your workspace</h1>
                <p class="text-muted mb-0">Sign in to continue organizing your ideas and priorities.</p>
              </div>

              <form id="login-form">
                <div class="mb-3">
                  <label for="username" class="form-label">Name</label>
                  <input id="username" class="form-control" type="text" placeholder="Your name" required />
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input id="password" class="form-control" type="password" placeholder="Password" required />
                </div>

                <div class="d-grid">
                  <button class="btn btn-primary" type="submit">Log in</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js?v=20260413-no-legacy"></script>
</body>
</html>
