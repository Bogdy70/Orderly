<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orderly | Space</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">Orderly</a>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-outline-secondary btn-sm" href="dashboard.html">Back to workspace</a>
      </div>
    </div>
  </nav>

  <main class="py-5 bg-light min-vh-100">
    <div class="container">
      <div id="project-header" class="mb-4"></div>

      <div id="project-not-found" class="alert alert-danger d-none">
        Space not found.
      </div>

      <div id="project-content" class="d-none">
        <div id="project-builder-panel" class="card border-0 shadow-sm mb-4 d-none">
          <div class="card-body p-4">
            <h2 class="h4 mb-1">Set up this space</h2>
            <p class="text-muted mb-3">Choose the first section you want to add to this space.</p>
            <div class="d-flex flex-wrap gap-2">
              <button id="add-checklist-section-btn" class="btn btn-outline-primary" type="button">Add checklist</button>
              <button id="add-task-section-btn" class="btn btn-outline-primary" type="button">Add action list</button>
            </div>
          </div>
        </div>

        <div class="row g-4" id="project-sections-row">
          <div class="col-lg-5" id="checklist-panel-col">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h2 class="h4 mb-0">Checklist</h2>
                </div>

                <div id="checklist-empty-message" class="alert alert-light border d-none">
                  No checklist items yet.
                </div>

                <form id="checklist-form" class="row g-2 mb-3 d-none">
                  <input id="editing-checklist-index" type="hidden" value="" />
                  <div class="col-8">
                    <input id="new-check-item" class="form-control" type="text" placeholder="Add checklist item" />
                  </div>
                  <div class="col-4 d-grid">
                    <button id="checklist-submit-btn" class="btn btn-primary" type="submit">Add</button>
                  </div>
                  <div class="col-12 d-none" id="checklist-cancel-wrap">
                    <button id="cancel-checklist-edit-btn" class="btn btn-outline-secondary btn-sm" type="button">Cancel edit</button>
                  </div>
                </form>

                <ul id="checklist-items" class="list-group list-group-flush"></ul>
              </div>
            </div>
          </div>

          <div class="col-lg-7" id="task-panel-col">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h2 class="h4 mb-0">Action List</h2>
                </div>

                <div id="tasks-empty-message" class="alert alert-light border d-none">
                  No action items yet.
                </div>

                <form id="task-form" class="row g-2 mb-3 d-none">
                  <input id="editing-task-index" type="hidden" value="" />
                  <div class="col-md-5">
                    <input id="new-task-name" class="form-control" type="text" placeholder="Action item" />
                  </div>
                  <div class="col-md-3">
                    <select id="new-task-status" class="form-select">
                      <option>Pending</option>
                      <option>In progress</option>
                      <option>Done</option>
                    </select>
                  </div>
                  <div class="col-md-2">
                    <select id="new-task-priority" class="form-select">
                      <option>Low</option>
                      <option>Medium</option>
                      <option>High</option>
                    </select>
                  </div>
                  <div class="col-md-2 d-grid">
                    <button id="task-submit-btn" class="btn btn-primary" type="submit">Add</button>
                  </div>
                  <div class="col-12 d-none" id="task-cancel-wrap">
                    <button id="cancel-task-edit-btn" class="btn btn-outline-secondary btn-sm" type="button">Cancel edit</button>
                  </div>
                </form>

                <div class="table-responsive">
                  <table class="table align-middle">
                    <thead>
                      <tr>
                        <th>Action</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th class="text-end">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="task-table-body"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>  
      </div>
    </div>
  </main>

  <script src="script.js?v=20260413-no-legacy"></script>
</body>
</html>
